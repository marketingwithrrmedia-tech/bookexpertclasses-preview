<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bookexpertclasses.com | Book Online Seat</title>
<style>
  :root{
    --black:#0a0a0a;
    --panel:#141210;
    --gold:#c9a25c;
    --gold-light:#e3c98a;
    --gold-dark:#96733a;
    --cream:#f4ead9;
    --orange:#e08a2b;
    --orange-dark:#b96c1a;
    --green:#25D366;
    --muted:#9a9184;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--black);
    color:var(--cream);
    line-height:1.5;
  }
  a{color:inherit;}

  /* Top info bar */
  .topbar{
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:11px;
    padding:22px 5%;
    font-size:13px;
    color:var(--gold-light);
    border-bottom:1px solid #221d16;
  }
  .topbar::before{
    content:"";
    position:absolute;
    top:-60%;
    left:-15%;
    width:65%;
    height:260%;
    background:linear-gradient(115deg, transparent 42%, rgba(201,162,92,.32) 50%, transparent 58%);
    transform:rotate(6deg);
    pointer-events:none;
  }
  .topbar .item{display:flex;align-items:center;gap:10px;white-space:nowrap;position:relative;z-index:1;}
  .topbar .icon{
    width:23px;height:23px;border-radius:50%;
    border:1px solid var(--gold-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;flex-shrink:0;
    background:rgba(201,162,92,.05);
  }
  .topbar .item.wa{color:var(--green);}
  .topbar .item.wa .icon{border-color:var(--green);}
  .topbar .item a{text-decoration:none;color:inherit;}

  /* Hero / badge */
  .hero-top{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }
  .fixed-top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    background:var(--black);
  }
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 5% 30px;
  }
  .badge{
    position:absolute;
    top:14px;
    right:5%;
    width:72px;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .badge img.site-logo{
    width:100%;
    height:auto;
    display:block;
  }

  .cta-row{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:30px;
  }
  .btn{
    display:inline-block;
    padding:14px 32px;
    border-radius:30px;
    font-weight:700;
    text-decoration:none;
    font-size:15px;
    cursor:pointer;
    border:2px solid var(--gold);
    transition:.2s;
    letter-spacing:.5px;
  }
  .btn-fill{background:linear-gradient(180deg,var(--orange),var(--orange-dark));color:#1c1200;border-color:var(--orange);}
  .btn-fill:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;color:var(--gold-light);}
  .btn-outline:hover{background:rgba(201,162,92,.12);}
  .hint{margin-top:16px;font-size:13px;color:var(--muted);}

  section{padding:44px 5%;max-width:1100px;margin:0 auto;}
  .section-title{text-align:center;font-size:26px;color:var(--gold-light);margin-bottom:26px;letter-spacing:.5px;}

  /* Book Online Seat */
  .book-box{
    border:1px solid var(--gold-dark);
    border-radius:14px;
    padding:32px;
    max-width:600px;
    margin:0 auto;
  }
  .book-summary{
    background:rgba(201,162,92,.08);
    border:1px dashed var(--gold);
    border-radius:8px;
    padding:12px 16px;
    font-size:13px;
    color:var(--gold-light);
    margin-bottom:22px;
  }
  .book-summary .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;}
  .book-summary .total{
    display:flex;justify-content:space-between;gap:10px;
    border-top:1px dashed var(--gold-dark);
    margin-top:8px;padding-top:8px;
    font-weight:700;color:var(--gold-light);
  }
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;color:var(--gold-light);margin-bottom:6px;font-weight:600;}
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--gold-dark);
    background:#151109;
    color:var(--cream);
    font-size:14px;
  }
  .field input:focus{outline:none;border-color:var(--gold);}
  .book-box .btn{width:100%;text-align:center;margin-top:6px;}
  .book-note{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;}

  footer{
    width:100%;
    border-top:1px solid #221d16;
    padding:26px 5%;
    text-align:center;
    font-size:12px;
    color:var(--muted);
  }
  .footer-brand{display:block;font-size:20px;font-weight:700;color:var(--gold-light);margin-bottom:8px;}
  footer a{color:var(--gold-light);text-decoration:underline;}
  footer a:hover{color:var(--gold);}

  @media(max-width:700px){
    body{font-size:15px;}
    .hero-top{
      flex-direction:column;
      align-items:flex-start;
      gap:8px;
      padding:14px 4% 8px;
    }
    .topbar{gap:8px;padding:0;font-size:7px;border-bottom:none;}
    .topbar .icon{width:14px;height:14px;font-size:7px;}
    .badge{width:144px;margin:0;top:10px;right:4%;}
    .badge .illustration{width:26%;margin-bottom:4px;}
    .badge .brand{font-size:10.5px;}
    .badge .tagline{font-size:6px;margin-top:3px;}
    .badge .cats{gap:6px;margin-top:5px;}
    .badge .cats .cicon{width:20px;height:20px;font-size:9px;}
    .badge .cats .clabel{font-size:5px;}
    .badge .laurel{font-size:6.5px;margin-top:5px;gap:3px;}
    .hero{padding:14px 5% 20px;}
    .cta-row{gap:10px;margin-top:16px;flex-wrap:nowrap;}
    .btn{padding:9px 14px;font-size:10.5px;white-space:nowrap;}

    section{padding:30px 4%;}
    .section-title{font-size:21px;margin-bottom:18px;}

    .book-box{padding:20px;}
    footer{font-size:11px;padding:20px 5%;}
    .footer-brand{font-size:15px;}
  }

  @media(max-width:380px){
    .badge{width:144px;}
    .topbar{font-size:6px;gap:6px;}
  }
</style>
</head>
<body>

<div class="hero-top">

  <div class="item"><span class="icon">✉️</span><a href="mailto:askus@bookexpertclasses.com">askus@bookexpertclasses.com</a></div>
</div>
</div>

<div class="badge">
    <img class="site-logo" src="logo.jpeg" alt="bookexpertclasses.com">
</div>
</div>

<div class="hero">
  <div class="cta-row"></div>

<section id="book">
  <h2 class="section-title">Book Online Seat</h2>
  <div class="book-box">
    <div class="book-summary" id="bookSummary"></div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="fName">
    </div>
    <div class="field">
      <label>WhatsApp Number</label>
      <input type="tel" id="fPhone">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="fEmail">
    </div>
    <div class="field">
      <label>Coupon Code (if any)</label>
      <input type="text" id="fCoupon">

</footer>

<script>
  function syncFixedTopHeight(){
    var ft = document.getElementById("fixedTop");
    if(!ft) return;
    var h = ft.offsetHeight;
    document.body.style.paddingTop = h + "px";
  }
  syncFixedTopHeight();
  window.addEventListener("load", syncFixedTopHeight);
  window.addEventListener("resize", syncFixedTopHeight);
  var __logoImg = document.querySelector(".site-logo");
  if(__logoImg) __logoImg.addEventListener("load", syncFixedTopHeight);

  let selections = []; // [{title, slot, price, paymentLink}, ...]
  try {
    const raw = sessionStorage.getItem("bxc_selections");
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) selections = parsed;
    }
  } catch(e) { selections = []; }

  function updateBookSummary(){
    const el = document.getElementById("bookSummary");
    if(!selections.length){
      el.innerHTML = "";
      return;
    }
    let html = selections.map(s => '<div class="row"><span>' + s.title + " — " + s.slot + '</span><span>₹' + s.price + '/-</span></div>').join("");
    if(selections.length > 1){
      const total = selections.reduce((sum,s) => sum + (parseFloat(s.price)||0), 0);
      html += '<div class="total"><span>Total</span><span>₹' + total + '/-</span></div>';
    }
    el.innerHTML = html;
  }
  updateBookSummary();

  document.getElementById("bookSubmit").addEventListener("click", function(e){
    e.preventDefault();
    if(!selections.length){
      alert("Please select time slot of the workshop then click book now.");
      window.location.href = "index.html#explore";
      return;
    }
    const name = document.getElementById("fName").value.trim();
    const phone = document.getElementById("fPhone").value.trim();
    const email = document.getElementById("fEmail").value.trim();
    const coupon = document.getElementById("fCoupon").value.trim();
    if(coupon) sessionStorage.setItem("bxc_coupon", coupon);
    if(!name || !phone || !email){
      alert("Please fill your name, WhatsApp number and email before booking.");
      return;
    }
    const missingLinks = selections.filter(s => !s.paymentLink || s.paymentLink === "TBD");
    if(missingLinks.length){
      alert("Payment link for " + missingLinks.map(s=>s.title).join(", ") + " isn't configured yet. (This is a preview — the live payment link(s) will be added before launch.)");
      return;
    }
    selections.forEach(s => window.open(s.paymentLink, "_blank"));
  });
</script>
