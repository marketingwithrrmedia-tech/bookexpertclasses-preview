  let selections = {}; // keyed by workshop title -> {title, slot, price, paymentLink}

  // Accepts a plain Google Drive "Share" link (or a raw image URL) and turns it into
  // a URL that actually renders as an <img>. Paste any normal Drive share link into
  // the sheet's "Expert Photo URL" column and this converts it automatically —
  // no manual re-processing needed.
  function driveImageUrl(raw){
    if(!raw) return "";
    const trimmed = raw.trim();
    const m = trimmed.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || trimmed.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(m){
      return "https://lh3.googleusercontent.com/d/" + m[1] + "=w800";
    }
    return trimmed;
  }

  function parseCSV(text){
    const lines = text.trim().split("\n").map(l => l.replace(/\r$/,""));
    const headers = lines[0].split(",").map(h => h.replace(/^"|"$/g,"").trim());
    return lines.slice(1).map(line => {
      // basic CSV split respecting quoted commas
      const cells = [];
      let cur = "", inQuotes = false;
      for(let i=0;i<line.length;i++){
        const ch = line[i];
        if(ch === '"'){ inQuotes = !inQuotes; continue; }
        if(ch === ',' && !inQuotes){ cells.push(cur); cur = ""; continue; }
        cur += ch;
      }
      cells.push(cur);
      const row = {};
      headers.forEach((h,i) => row[h] = (cells[i]||"").trim());
      return row;
    });
  }

      el.textContent = items[0].title + " — ₹" + items[0].price + "/-";
    } else {
      const total = items.reduce((sum,i) => sum + (parseFloat(i.price)||0), 0);
      el.textContent = items.length + " classes selected — Total ₹" + total + "/-";
    }
  }

  function persistSelections(){
    sessionStorage.setItem("bxc_selections", JSON.stringify(Object.values(selections)));
  }

  function ordinalSuffix(n){
    n = parseInt(n,10);
    if(isNaN(n)) return "";
    const v = n % 100;
    if(v >= 11 && v <= 13) return "th";
    switch(n % 10){
      case 1: return "st";
      case 2: return "nd";
      case 3: return "rd";
      default: return "th";
    }
  }

  // Renders a fixed 4-column table: the first 2 columns are the workshop's
  // real day/date slots (or "—" if the workshop has fewer than 2 days), and
  // the 3rd/4th columns are always a blank spacer + a "New Dates" teaser —
  // matching the approved card layout exactly. Always exactly 2 time rows.
  function buildSlotTable(card, row){
    const days = [];
    for(let i=1;i<=4;i++){
      const nm = (row["Day " + i + " Name"]||"").trim();
      const dt = (row["Day " + i + " Date"]||"").trim();
      const a = (row["Day " + i + " Time Slot A"]||"").trim();
      const b = (row["Day " + i + " Time Slot B"]||"").trim();
      if(nm) days.push({name:nm, date:dt, a:a, b:b});
    }

    if(days.length === 0){
      const p = document.createElement("div");
      p.className = "no-slots";
      p.textContent = "Dates & times coming soon.";
      return p;
    }

    const cols = days.slice(0,4);
    const remaining = 4 - cols.length;
    for(let i=0;i<remaining;i++){
      cols.push({name:"", date:"", a:"", b:"", isNewDates:(i === remaining-1)});
    }

    const wrap = document.createElement("div");
    wrap.className = "slot-table-wrap";
    const table = document.createElement("table");
    table.className = "slot-table";
    const thead = document.createElement("tr");
    cols.forEach(function(d){
      const th = document.createElement("th");
      if(d.name && d.date){
        const dm = d.date.match(/^(\d+)\s*(.*)$/);
        if(dm){
          th.innerHTML = d.name + " (" + dm[1] + "<sup>" + ordinalSuffix(dm[1]) + "</sup> " + dm[2] + ")";
        } else {
          th.textContent = d.name + " (" + d.date + ")";
        }
      } else if(d.name){
        th.textContent = d.name;
      } else if(d.isNewDates){
        th.textContent = "New Dates";
      } else {
        th.className = "slot-spacer";
        th.innerHTML = "&nbsp;";
      }
      thead.appendChild(th);
    });
    table.appendChild(thead);

    ["a","b"].forEach(function(slotKey){
      const tr = document.createElement("tr");
      cols.forEach(function(d){
        const td = document.createElement("td");
        const val = d[slotKey];
        if(!d.name){
          td.className = "slot-spacer";
        } else if(val){
          td.textContent = val;
          td.className = "slot-cell";
          td.onclick = function(){
            const key = card.dataset.title;
            const label = d.name + " " + d.date + ", " + val;
            const alreadySelected = td.classList.contains("selected");
            card.querySelectorAll(".slot-cell.selected").forEach(function(el){ el.classList.remove("selected"); });
            const tagEl = card.querySelector(".selected-tag");
            if(alreadySelected){
              delete selections[key];
              tagEl.textContent = "";
            } else {
              td.classList.add("selected");
              tagEl.textContent = "Selected: " + label;
              selections[key] = {
                title: card.dataset.title,
                slot: label,
                price: card.dataset.price,
                paymentLink: card.dataset.paymentlink
              };
            }
            persistSelections();
            updateBookSeatBar();
          };
        } else {
          td.className = "slot-empty";
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    return wrap;
  }

  function renderClasses(rows){
    const active = rows.filter(r => (r["Active (Yes/No)"]||"").toLowerCase() !== "no" && r["Workshop Title"]);
    const list = document.getElementById("classList");
    list.innerHTML = "";

    active.forEach((c, idx) => {
      const card = document.createElement("div");
      card.className = "class-card";
      card.dataset.title = c["Workshop Title"];
      card.dataset.price = c["Price (INR)"];
      card.dataset.paymentlink = c["Payment Link"];

      let subcatsList = [c["Subcategory 1"],c["Subcategory 2"],c["Subcategory 3"],c["Subcategory 4"],c["Subcategory 5"]].map(function(s){return (s||"").trim();}).filter(Boolean);
      while(subcatsList.length < 5) subcatsList.push("");
      const subcatHTML = ["(Class Sub Categories)"].concat(subcatsList).map(function(s){return "<div>"+s+"</div>";}).join("");

      const credsList = [c["Expert Credential 1"],c["Expert Credential 2"],c["Expert Credential 3"]].map(function(s){return (s||"").trim();}).filter(Boolean);
      const credsItems = credsList.length ? credsList : ["Credentials coming soon"];
      const credsHTML = ["(Expert Credentials)"].concat(credsItems).map(function(s){return '<div class="cred-item">'+s+"</div>";}).join("");

      const photoHTML = c["Expert Photo URL"]
        ? '<img src="' + driveImageUrl(c["Expert Photo URL"]) + '" alt="' + c["Expert Name"] + '" onerror="this.parentElement.innerHTML=' + String.fromCharCode(39) + '&lt;div class=&quot;ph-icon&quot;&gt;' + "\uD83E\uDDD1\u200D\uD83D\uDCBC" + '&lt;/div&gt;&lt;div class=&quot;ph-caption&quot;&gt;Photo coming soon&lt;/div&gt;' + String.fromCharCode(39) + ';">'
        : '<div class="ph-icon">' + "\uD83E\uDDD1\u200D\uD83D\uDCBC" + '</div><div class="ph-caption">Photo coming soon</div>';

      card.innerHTML =
        '<div class="class-main">' +
          '<div class="class-top">' +
            '<span class="pill">Online<br>Workshop ' + (idx+1) + '</span>' +
            '<div class="class-title">' +
              "<h3>" + c["Workshop Title"] + "</h3>" +
              '<div class="dur">(' + (c["Duration"]||"") + ')</div>' +
            "</div>" +
            '<span class="price">₹ ' + c["Price (INR)"] + '/-</span>' +
          "</div>" +
          '<div class="subcat-grid">' + subcatHTML + "</div>" +
          '<div class="action-row">' +
            '<span class="slot-trigger-group">' +
            '<span class="camera-icon">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>' + "</span>" +
            '<span class="select-slot-pill">Select time slot<br>\u2193</span>' +
            "</span>" +
            '<button class="share-btn" title="Share this class">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>' + "</button>" +
          "</div>" +
          '<div class="selected-tag"></div>' +
          '<div class="slot-holder"></div>' +
        "</div>" +
        '<div class="expert-col">' +
          '<div class="expert-credentials">' + credsHTML + "</div>" +
          '<div class="expert-photo">' + photoHTML + "</div>" +
          '<div class="expert-name-wrap"><div class="expert-name">' + (c["Expert Name"]||"Expert TBA") + "</div></div>" +
        "</div>";

      const slotHolder = card.querySelector(".slot-holder");
      slotHolder.appendChild(buildSlotTable(card, c));

      card.querySelector(".share-btn").onclick = () => {
        const url = location.origin + location.pathname + "#class-" + (idx+1);
        const text = c["Workshop Title"] + " — ₹" + c["Price (INR)"] + "/- — bookexpertclasses.com";
        if(navigator.share){
          navigator.share({title:c["Workshop Title"], text, url}).catch(()=>{});
        } else {
          navigator.clipboard.writeText(url).then(()=>alert("Link copied: " + url));
        }
      };

      card.id = "class-" + (idx+1);
      list.appendChild(card);
    });

    // Static "upcoming next week" teaser card
    const teaser = document.createElement("div");
    teaser.className = "class-card teaser";
    teaser.innerHTML =
      '<div class="class-main">' +
        '<div class="class-top">' +
          '<span class="pill">Online<br>Workshop ' + (active.length+1) + '</span>' +
          '<div class="class-title">' +
            "<h3>New Upcoming Classes Next Week</h3>" +
            '<div class="dur">(Details announced soon)</div>' +
          "</div>" +
          '<span class="price">₹ 350/-</span>' +
        "</div>" +
        '<div class="subcat-grid">' +
          "<div>(Class Sub Categories)</div>" +
          '<div style="grid-column:2/3;">&nbsp;</div>' +
          '<div style="grid-column:1/-1;color:var(--muted);">New workshops are added regularly — check back soon or follow our socials for updates.</div>' +
        "</div>" +
        '<div class="action-row">' +
          '<span class="camera-icon">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>' + "</span>" +
          '<span class="select-slot-pill">Select time slot<br>\u2193</span>' +
          "<span></span>" +
        "</div>" +
        '<div class="no-slots">Dates opening soon.</div>' +
      "</div>" +
      '<div class="expert-col">' +
        '<div class="expert-credentials"><div class="cred-item">(Expert Credentials)</div><div class="cred-item">To be announced</div></div>' +
        '<div class="expert-photo"><div class="ph-icon">' + "\uD83E\uDDD1\u200D\uD83D\uDCBC" + '</div><div class="ph-caption">Photo coming soon</div></div>' +
        '<div class="expert-name-wrap"><div class="expert-name">Expert TBA</div></div>' +
      "</div>";
    list.appendChild(teaser);

    // Real pagination: split into pages of PER_PAGE cards each
    const pag = document.getElementById("pagination");
    pag.innerHTML = "";
    const allCards = Array.from(list.children);
    const PER_PAGE = 8;
    const pageCount = Math.max(1, Math.ceil(allCards.length / PER_PAGE));

    function showPage(n){
      allCards.forEach(function(c, idx){
        c.style.display = (idx >= (n-1)*PER_PAGE && idx < n*PER_PAGE) ? "" : "none";
      });
      Array.from(pag.children).forEach(function(b, i){
        b.classList.toggle("active", i === (n-1));
      });
      list.scrollIntoView({behavior:"smooth", block:"start"});
    }

    for(let p = 1; p <= pageCount; p++){
      const btn = document.createElement("div");
      btn.textContent = String(p);
      if(p === 1) btn.className = "active";
      btn.onclick = function(){ showPage(p); };
      pag.appendChild(btn);
    }

    showPage(1);
  }

  fetch(SHEET_CSV_URL)
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(text => renderClasses(parseCSV(text)))
    .catch(() => renderClasses(FALLBACK));

  function goToBook(e){
    if(Object.keys(selections).length === 0){
      e.preventDefault();
      alert("Please select time slot of the workshop then click book now.");
      return;
    }
    persistSelections();
  }
  document.getElementById("bookSeatTop").addEventListener("click", goToBook);
  document.getElementById("bookSeatNowBtn").addEventListener("click", goToBook);
</script>

</body>
</html>
